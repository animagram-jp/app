name: "Deploy to Cloudflare"

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "cloudflare"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: "resolve version"
              run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

            - name: "install nightly toolchain (for -Z build-std)"
              run: |
                  rustup toolchain install nightly --component rust-src
                  rustup override set nightly
                  rustup target add wasm32-unknown-unknown

            - name: "install wasm-bindgen-cli"
              run: |
                  version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
                  cargo install wasm-bindgen-cli --version "$version" --locked

            - name: "cargo test (doctest only; --lib requires a browser runner)"
              run: |
                  cargo test --doc --locked
                  cargo test --doc --locked --features calendar

            - name: "build both sites"
              run: examples/cloudflare.sh

            - name: "upload app"
              uses: actions/upload-artifact@v7
              with:
                  name: "app"
                  path: "target/cloudflare/app"

            - name: "upload calendar"
              uses: actions/upload-artifact@v7
              with:
                  name: "calendar"
                  path: "target/cloudflare/calendar"

    deploy-app:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7

            - name: "download app"
              uses: actions/download-artifact@v8
              with:
                  name: "app"
                  path: "target/cloudflare/app"

            - name: "wrangler deploy"
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config cloudflare/app/wrangler.jsonc

    deploy-calendar:
        needs: deploy-app
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7

            - name: "download calendar"
              uses: actions/download-artifact@v8
              with:
                  name: "calendar"
                  path: "target/cloudflare/calendar"

            - name: "wrangler deploy"
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config cloudflare/calendar/wrangler.jsonc
