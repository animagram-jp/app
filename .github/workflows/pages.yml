name: "Deploy to Pages"

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:
        inputs:
            cloudflare:
                description: "deploy to Cloudflare Workers"
                type: boolean
                default: true
            github:
                description: "deploy to GitHub Pages"
                type: boolean
                default: false
            server:
                description: "build server"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: "resolve version"
              run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

            - name: "install toolchain"
              run: rustup toolchain install

            - name: "install wasm-bindgen-cli"
              run: |
                  version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
                  cargo install wasm-bindgen-cli --version "$version" --locked

            - name: "cargo test"
              run: |
                  cargo test --doc --locked
                  cargo test --lib --locked
                  cargo test --lib --locked --features calendar
                  cargo test --lib --locked --no-default-features --features coc7th
                  cargo test --lib --locked --features server
                  cargo build --locked --features server --bin server

            - name: "build"
              run: reference/build.sh

            - name: "upload app"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: "app"
                  path: "target/cloudflare/app"

    build-server:
        needs: build
        if: github.event_name == 'workflow_dispatch' && inputs.server
        runs-on: ubuntu-24.04-arm
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "install toolchain"
              run: rustup toolchain install

            - name: "cargo build"
              run: cargo build --release --locked --features server --bin server

            - name: "upload server"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: "server"
                  path: "target/release/server"

    deploy-server:
        needs: build-server
        runs-on: ubuntu-latest
        environment:
            name: server
        steps:
            - name: "notify"
              run: "true"

    deploy-app:
        needs: build
        if: github.event_name == 'push' || inputs.cloudflare
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "download app"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: "app"
                  path: "target/cloudflare/app"

            - name: "wrangler deploy"
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config reference/app/wrangler.toml

    deploy-github:
        needs: build
        if: github.event_name == 'workflow_dispatch' && inputs.github
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: "download app"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: "app"
                  path: "distribution"

            - name: "setup Github Pages"
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: "upload artifact as Github Pages"
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: "./distribution"

            - name: "deploy to GitHub Pages"
              id: "deployment"
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
