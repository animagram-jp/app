name: "Deploy to Pages"

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:
        inputs:
            cloudflare:
                description: "deploy to Cloudflare Workers (static assets)"
                type: boolean
                default: true
            github:
                description: "deploy to GitHub Pages"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: "resolve version"
              run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

            - name: "install toolchain"
              run: rustup toolchain install

            - name: "install wasm-bindgen-cli"
              run: |
                  version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
                  cargo install wasm-bindgen-cli --version "$version" --locked

            - name: "cargo test (doctest only; --lib requires a browser runner)"
              run: |
                  cargo test --doc --locked
                  cargo test --doc --locked --features calendar

            - name: "build both sites"
              run: reference/build.sh

            - name: "upload app"
              uses: actions/upload-artifact@v7
              with:
                  name: "app"
                  path: "target/cloudflare/app"

            - name: "upload calendar"
              uses: actions/upload-artifact@v7
              with:
                  name: "calendar"
                  path: "target/cloudflare/calendar"

    deploy-app:
        needs: build
        if: github.event_name == 'push' || inputs.cloudflare
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7

            - name: "download app"
              uses: actions/download-artifact@v8
              with:
                  name: "app"
                  path: "target/cloudflare/app"

            - name: "wrangler deploy"
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config reference/app/wrangler.toml

    deploy-calendar:
        needs: deploy-app
        if: github.event_name == 'push' || inputs.cloudflare
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7

            - name: "download calendar"
              uses: actions/download-artifact@v8
              with:
                  name: "calendar"
                  path: "target/cloudflare/calendar"

            - name: "wrangler deploy"
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config reference/calendar/wrangler.toml

    deploy-github:
        needs: build
        if: github.event_name == 'workflow_dispatch' && inputs.github
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: "download app"
              uses: actions/download-artifact@v8
              with:
                  name: "app"
                  path: "distribution"

            - name: "setup Github Pages"
              uses: actions/configure-pages@v6

            - name: "upload artifact as Github Pages"
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "./distribution"

            - name: "deploy to GitHub Pages"
              id: "deployment"
              uses: actions/deploy-pages@v5
