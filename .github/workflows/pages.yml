name: "Deploy to GitHub Pages"

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: "resolve version"
              run: |
                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                      VERSION="${GITHUB_REF_NAME}"
                  else
                      VERSION="$(git describe --tags --always)"
                  fi
                  echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

            - name: "add wasm32 target"
              run: rustup target add wasm32-unknown-unknown

            - name: "install nightly toolchain (for -Z build-std)"
              run: |
                  rustup toolchain install nightly --component rust-src
                  rustup override set nightly

            - name: "install wasm-bindgen-cli"
              run: |
                  version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
                  cargo install wasm-bindgen-cli --version "$version" --locked

            - name: "cargo test (doctest only; --lib requires a browser runner)"
              run: cargo test --doc --locked

            - name: "cargo build (wasm32, web worker)"
              run: |
                  RUSTFLAGS="-Ctarget-feature=+atomics,+bulk-memory -Clink-arg=--import-memory -Clink-arg=--shared-memory -Clink-arg=--max-memory=134217728 -Clink-arg=--export=__wasm_init_tls -Clink-arg=--export=__tls_size -Clink-arg=--export=__tls_align -Clink-arg=--export=__tls_base" \
                  cargo build --release --target wasm32-unknown-unknown -Zbuild-std=std,panic_abort

            - name: "wasm-bindgen"
              run: |
                  wasm-bindgen --target web --out-dir distribution/app --out-name app \
                    target/wasm32-unknown-unknown/release/app.wasm

            - name: "remove wasm-bindgen package boilerplate (no suppression flag exists)"
              run: rm -f distribution/app/README.md distribution/app/LICENSE

            - name: "inject version into distribution files"
              # sw.js の VERSION 定数がビルドごとに変わらないと、ブラウザが
              # 新しい Service Worker への更新を検知できない
              # (byte 単位比較のため)。PRECACHE / index.html / manifest.json
              # の ?v={version} も同様にキャッシュバスティング用。
              run: |
                  sed -i "s/{version}/${VERSION}/g" \
                      distribution/sw.js distribution/index.html distribution/manifest.json distribution/init.js distribution/worker.js

            - name: "setup Github Pages"
              uses: actions/configure-pages@v6

            - name: "upload artifact as Github Pages"
              uses: actions/upload-pages-artifact@v5
              with:
                path: "./distribution"

            - name: "deploy to GitHub Pages"
              id: "deployment"
              uses: actions/deploy-pages@v5
