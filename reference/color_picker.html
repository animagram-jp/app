<!--
    color_picker.rs の DOM。id は dom::Id の経路 (tag[-n] を "_" で連結)。
    値・文字・色・checked は初期描画 (ColorPicker::draw) が設定する。
-->
<section id="main_section-1" aria-label="Color Picker">
    <div id="main_section-1_div">
        <input id="main_section-1_div_input" type="text" maxlength="7" aria-label="HEX"></div>
    <label>
        <span>H</span>
        <input id="main_section-1_label-1_input" type="range" min="0" max="360">
        <output id="main_section-1_label-1_output"></output></label>
    <label>
        <span>S</span>
        <input id="main_section-1_label-2_input" type="range" min="0" max="100">
        <output id="main_section-1_label-2_output"></output></label>
    <label>
        <span>L</span>
        <input id="main_section-1_label-3_input" type="range" min="0" max="100">
        <output id="main_section-1_label-3_output"></output></label>
    <fieldset id="main_section-1_fieldset">
        <label>
            <span id="main_section-1_fieldset_label-1_span"></span>
            <input id="main_section-1_fieldset_label-1_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label>
        <label>
            <span id="main_section-1_fieldset_label-2_span"></span>
            <input id="main_section-1_fieldset_label-2_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label>
        <label>
            <span id="main_section-1_fieldset_label-3_span"></span>
            <input id="main_section-1_fieldset_label-3_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label>
        <label>
            <span id="main_section-1_fieldset_label-4_span"></span>
            <input id="main_section-1_fieldset_label-4_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label>
        <label>
            <span id="main_section-1_fieldset_label-5_span"></span>
            <input id="main_section-1_fieldset_label-5_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label>
        <label>
            <span id="main_section-1_fieldset_label-6_span"></span>
            <input id="main_section-1_fieldset_label-6_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label>
        <label>
            <span id="main_section-1_fieldset_label-7_span"></span>
            <input id="main_section-1_fieldset_label-7_input" type="radio" name="main_section-1_fieldset" data-surround="outline" data-sign="check"></label></fieldset></section>
