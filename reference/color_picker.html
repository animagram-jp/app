<!--
    color_picker.rs の DOM。id は dom::Id の経路 (tag[-n] を "_" で連結)。class は使わない。
    hex の検証は Rust 側 (#RRGGBB 以外は無視)。HTML 側は maxlength のみ。
-->
<section id="main_section-1" aria-label="Color Picker">
    <div id="main_section-1_div">
        <input id="main_section-1_div_input" type="text" value="#6366F1" maxlength="7" spellcheck="false" aria-label="HEX"></div>

    <label id="main_section-1_label-1">
        <span>H</span>
        <input id="main_section-1_label-1_input" type="range" min="0" max="360" step="1" value="239">
        <output id="main_section-1_label-1_output">239°</output></label>
    <label id="main_section-1_label-2">
        <span>S</span>
        <input id="main_section-1_label-2_input" type="range" min="0" max="100" step="1" value="84">
        <output id="main_section-1_label-2_output">84%</output></label>
    <label id="main_section-1_label-3">
        <span>L</span>
        <input id="main_section-1_label-3_input" type="range" min="0" max="100" step="1" value="67">
        <output id="main_section-1_label-3_output">67%</output></label>

    <ul id="main_section-1_ul">
        <li id="main_section-1_ul_li-1">
            <button id="main_section-1_ul_li-1_button" type="button" data-surround="outline"></button></li>
        <li id="main_section-1_ul_li-2">
            <button id="main_section-1_ul_li-2_button" type="button" data-surround="outline"></button></li>
        <li id="main_section-1_ul_li-3">
            <button id="main_section-1_ul_li-3_button" type="button" data-surround="outline"></button></li>
        <li id="main_section-1_ul_li-4">
            <button id="main_section-1_ul_li-4_button" type="button" data-surround="outline"></button></li>
        <li id="main_section-1_ul_li-5">
            <button id="main_section-1_ul_li-5_button" type="button" data-surround="outline"></button></li>
        <li id="main_section-1_ul_li-6">
            <button id="main_section-1_ul_li-6_button" type="button" data-surround="outline"></button></li>
        <li id="main_section-1_ul_li-7">
            <button id="main_section-1_ul_li-7_button" type="button" data-surround="outline"></button></li></ul></section>
