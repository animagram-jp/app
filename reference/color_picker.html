<div class="cp-root">

  <div class="cp-preview" id="cp-preview">
    <input
      type="text"
      id="cp-hex-input"
      class="cp-hex-input"
      value="#6366F1"
      maxlength="7"
      spellcheck="false"
      pattern="#[0-9A-Fa-f]{6}"
    >
  </div>

  <div class="cp-panel">
    <div class="cp-panel-label">HSL</div>
    <div class="cp-slider-group">

      <div class="cp-slider-row">
        <span class="cp-slider-ch" style="color:#f7a26a">H</span>
        <input type="range" id="cp-h-slider" min="0" max="360" value="239">
        <span class="cp-val" id="cp-h-val">239°</span>
      </div>

      <div class="cp-slider-row">
        <span class="cp-slider-ch" style="color:#a2f7b0">S</span>
        <input type="range" id="cp-s-slider" min="0" max="100" value="84">
        <span class="cp-val" id="cp-s-val">84%</span>
      </div>

      <div class="cp-slider-row">
        <span class="cp-slider-ch" style="color:#f7f7a2">L</span>
        <input type="range" id="cp-l-slider" min="0" max="100" value="67">
        <span class="cp-val" id="cp-l-val">67%</span>
      </div>

    </div>
  </div>

  <div class="cp-panel">
    <div class="cp-panel-label">Palette</div>
    <div class="cp-swatches">
      <button class="cp-swatch" id="cp-swatch-0" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-0"></span>
      </button>
      <button class="cp-swatch" id="cp-swatch-1" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-1"></span>
      </button>
      <button class="cp-swatch" id="cp-swatch-2" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-2"></span>
      </button>
      <button class="cp-swatch" id="cp-swatch-3" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-3"></span>
      </button>
      <button class="cp-swatch" id="cp-swatch-4" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-4"></span>
      </button>
      <button class="cp-swatch" id="cp-swatch-5" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-5"></span>
      </button>
      <button class="cp-swatch" id="cp-swatch-6" data-hex="">
        <span class="cp-swatch-tip" id="cp-swatch-tip-6"></span>
      </button>
    </div>
  </div>

</div>
