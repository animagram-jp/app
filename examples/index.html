<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dice-engine (CoC 7th)</title>
  <link rel="stylesheet" href="dads-base.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="init.js"></script>
</head>

<body>
  <main>
    <div id="character">
      <div id="char-header">
        <button id="char-roll">ダイスロール</button>
      </div>
      <div id="char-stats">
        <label>STR <input id="char-str" type="number" min="0" max="9999" placeholder="—"></label>
        <label>CON <input id="char-con" type="number" min="0" max="9999" placeholder="—"></label>
        <label>SIZ <input id="char-siz" type="number" min="0" max="9999" placeholder="—"></label>
        <label>DEX <input id="char-dex" type="number" min="0" max="9999" placeholder="—"></label>
        <label>APP <input id="char-app" type="number" min="0" max="9999" placeholder="—"></label>
        <label>INT <input id="char-int" type="number" min="0" max="9999" placeholder="—"></label>
        <label>POW <input id="char-pow" type="number" min="0" max="9999" placeholder="—"></label>
        <label>EDU <input id="char-edu" type="number" min="0" max="9999" placeholder="—"></label>
        <label>幸運 <input id="char-luk" type="number" min="0" max="9999" placeholder="—"></label>
      </div>
      <div id="char-derived">
        <span>HP <span id="char-hp">—</span></span>
        <span>MP <span id="char-mp">—</span></span>
        <span>SAN <span id="char-san">—</span></span>
        <span>回避 <span id="char-dodge">—</span></span>
      </div>
    </div>

    <div id="chat-log"></div>

    <div id="char-selector" hidden>
      <div id="char-selector-overlay"></div>
      <div id="char-selector-menu">
        <button id="charroll-str">STR 筋力</button>
        <button id="charroll-con">CON 体質</button>
        <button id="charroll-siz">SIZ 体格</button>
        <button id="charroll-dex">DEX 敏捷</button>
        <button id="charroll-app">APP 外見</button>
        <button id="charroll-int">INT 知性</button>
        <button id="charroll-pow">POW 意志</button>
        <button id="charroll-edu">EDU 教育</button>
        <button id="charroll-luk">幸運</button>
      </div>
    </div>

    <div id="selector" hidden>
      <div id="selector-overlay"></div>
      <div id="selector-menu">
        <button id="roll-skill">技能判定</button>
        <button id="roll-char">能力値判定</button>
        <button id="roll-sanity">正気度判定</button>
        <button id="roll-madness-rt">狂気の発作 (リアルタイム)</button>
        <button id="roll-madness-sum">狂気の発作 (サマリー)</button>
        <button id="roll-combine">組み合わせ判定</button>
        <button id="roll-pushed">プッシュロール</button>
        <button id="roll-autofire">自動火器の連射判定</button>
        <button id="roll-cast-minor">呪文失敗 (小)</button>
        <button id="roll-cast-major">呪文失敗 (大)</button>
        <button id="roll-phobia">恐怖症表</button>
        <button id="roll-mania">マニア表</button>
      </div>
    </div>

    <form id="chat-form">
      <textarea id="chat-input" name="text" rows="2" placeholder="/ でコマンド選択"></textarea>
      <button type="submit">送信</button>
    </form>
  </main>
</body>

</html>
