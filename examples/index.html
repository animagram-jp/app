    <div id="char-selector" hidden inert>

      <button type="submit" class="dads-button" data-type="solid-fill" data-size="sm">送信</button>
    </form>

    <header>

      <button id="char-edit-cancel" type="button">×</button>

        <legend>能力値 <button id="char-roll" type="button" class="dads-button" data-type="outline" data-size="xs">ダイスロール</button></legend>

        <field><label>SIZ</label>  <input id="edit-siz" type="number" min="0" max="9999" name="stat-siz"></field>
