<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dice Engine (Call of Cthulhu 7th)</title>
    <link rel="stylesheet" href="dads-base.css">
    <link rel="stylesheet" href="button.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="init.js"></script>
  </head>

  <body>
    <main>
      <header>
        <button id="main_header_button" class="dads-button" data-type="outline" data-size="sm">✏️</button>
      </header>
      <div>
        <section id="character">
          <span id="main_span1" class="hidden"><span id="main_span1_span1"></span><span id="main_span1_span2"></span></span>
        </section>
        <div id="main_display"></div>
        <textarea id="main_textarea" name="main_textarea" rows="2" placeholder="/"></textarea>
        <button id="main_textarea_submit" type="submit" class="dads-button" data-type="solid-fill"
          data-size="sm">↑</button>

        <div id="main_overlay" class="hidden">
          <span id="main_overlay_label" class="hidden"></span>
          <button id="main_overlay_select1" class="hidden"></button>
          <button id="main_overlay_focus" tabindex="0"></button>
          <span id="main_overlay_value" class="hidden"></span>
          <button id="main_overlay_down" type="button" class="hidden">－</button>
          <button id="main_overlay_up" type="button" class="hidden">＋</button>
          <button id="main_overlay_next" type="button" class="hidden"></button>
        </div>
      </div>
      <footer></footer>
    </main>

    <dialog id="drawer">
      <header></header>
      <section></section>
      <footer></footer>
    </dialog>

    <dialog id="modal">
      <header>
        <h4></h4>
      </header>
      <fieldset id="modal_fieldset1">
        <legend>
          <h5 id="modal_fieldset1_legend_h5"></h5>
          <button id="modal_fieldset1_legend_button" type="button" class="dads-button" data-type="outline" data-size="xs"></button>
        </legend>
        <table>
          <thead>
            <tr id="modal_fieldset1_table_thead_tr">
              <th id="modal_fieldset1_table_thead_th1"></th>
              <th id="modal_fieldset1_table_thead_th2"></th>
              <th id="modal_fieldset1_table_thead_th3"></th>
              <th id="modal_fieldset1_table_thead_th4"></th>
              <th id="modal_fieldset1_table_thead_th5"></th>
            </tr>
          </thead>
          <tr id="modal_fieldset1_table_tr1">
            <th id="modal_fieldset1_table_tr1_th"></th>
            <td><input id="modal_fieldset1_table_tr1_input1" type="number" min="0" max="9999" name="modal_fieldset1_table_tr1_input1"></td>
            <td><input id="modal_fieldset1_table_tr1_input2" type="number" min="0" max="9999" name="modal_fieldset1_table_tr1_input2"></td>
            <td><input id="modal_fieldset1_table_tr1_input3" type="number" min="0" max="9999" name="modal_fieldset1_table_tr1_input3"></td>
            <td><button id="modal_fieldset1_table_tr1_button" type="button" class="dads-button" data-type="outline" data-size="xs">🎲</button></td>
          </tr>
        </table>
      </fieldset>
      <fieldset id="modal_fieldset2">
        <legend>
          <h5 id="modal_fieldset2_legend_h5"></h5>
          <button id="modal_fieldset2_legend_button" type="button" class="dads-button" data-type="outline"
            data-size="xs"></button>
        </legend>
        <table>
          <thead>
            <tr id="modal_fieldset2_table_thead_tr">
              <th id="modal_fieldset2_table_thead_th1"></th>
              <th id="modal_fieldset2_table_thead_th2"></th>
              <th id="modal_fieldset2_table_thead_th3"></th>
              <th id="modal_fieldset2_table_thead_th4"></th>
              <th id="modal_fieldset2_table_thead_th5"></th>
            </tr>
          </thead>
          <tr id="modal_fieldset2_table_tr1">
            <th id="modal_fieldset2_table_tr1_th"></th>
            <td><input id="modal_fieldset2_table_tr1_input1" type="number" min="0" max="9999" name="modal_fieldset2_table_tr1_input1"></td>
            <td><input id="modal_fieldset2_table_tr1_input2" type="number" min="0" max="9999" name="modal_fieldset2_table_tr1_input2"></td>
            <td><input id="modal_fieldset2_table_tr1_input3" type="number" min="0" max="9999" name="modal_fieldset2_table_tr1_input3"></td>
            <td><button id="modal_fieldset2_table_tr1_button" type="button" class="dads-button" data-type="outline" data-size="xs">🎲</button></td>
          </tr>
        </table>
      </fieldset>
      <footer>
        <button id="modal_save" type="submit" form="form" class="dads-button" data-type="solid-fill" data-size="sm">💾</button>
      </footer>
    </dialog>
    <form id="form" method="dialog"></form>
  </body>
</html>
