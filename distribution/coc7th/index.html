            <h1>CoC7th</h1>
            <p>Call of Cthulhu 7th edition playing tool</p></hgroup>
        <button id="header_button-1" type="button" popovertarget="header_div-1" aria-haspopup="listbox" aria-expanded="false" aria-controls="header_div-1" data-surround="outline"></button>

            <span role="presentation">Select Character</span>
            <button id="header_div-1_button-1" role="option" value="1"></button>
            <button id="header_div-1_button-2" role="option" value="2" hidden></button>
            <button id="header_div-1_button-3" role="option" value="3" hidden></button>
            <button id="header_div-1_button-4" role="option" value="4" hidden></button></div>

        <div id="header_div-2" popover="auto" role="listbox" aria-labelledby="header_button-3">
            <label>
                <span>Main</span>

            <label id="header_div-2_label-1">
                <input id="header_div-2_label-1_input" name="color-scheme" role="option" type="radio" value="light-less-contrast" data-sign="check" data-sign-style="inline">

            <label id="header_div-2_label-2">
                <input id="header_div-2_label-2_input" name="color-scheme" role="option" type="radio" value="light" data-sign="check" data-sign-style="inline">

                <input id="header_div-2_label-3_input" name="color-scheme" role="option" type="radio" value="light-more-contrast" data-sign="check" data-sign-style="inline">

            <label id="header_div-2_label-4">
