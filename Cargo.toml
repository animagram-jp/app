[package]
name = "app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Gui application for editing and reading structured data."
license = "Apache-2.0"
repository = "https://github.com/animagram-jp/app"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arbitrary-int    = "2"
argon2           = { version = "0.6", default-features = false, features = ["alloc"], optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
hmac             = { version = "0.13", default-features = false, optional = true }
libm             = { version = "0.2", default-features = false }
serde_json       = { version = "1", default-features = false, features = ["alloc"], optional = true }
sha2             = { version = "0.11", default-features = false, optional = true }
wasm-bindgen     = { version = "0.2", default-features = false }
getrandom = { version = "0.4", default-features = false }
hkdf      = { version = "0.13", default-features = false, optional = true }
js-sys    = { version = "0.3", default-features = false }
rectgrid  = { version = "0.4", features = ["geometry"], optional = true }
rand                 = { version = "0.10", default-features = false, features = ["sys_rng"], optional = true }
wasm-bindgen-futures = { version = "0.4", default-features = false }
web-sys = { version = "0.3", default-features = false, optional = true, features = [
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemGetFileOptions",
    "FileSystemFileHandle",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "DomException",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom     = { version = "0.4", default-features = false, features = ["wasm_js"] }
spinning_top  = { version = "0.3", default-features = false }
talc          = { version = "5.1", default-features = false }

[features]
default = ["coc7th", "file_store", "vault"]
coc7th     = ["dep:rand"]
credential = ["dep:hmac", "dep:sha2", "dep:hkdf"]
file_store = ["dep:web-sys"]
calendar = ["file_store", "dep:serde_json", "dep:rectgrid"]
vault    = ["credential", "dep:argon2", "dep:chacha20poly1305"]

[profile.release]
panic         = "abort"
lto           = "fat"
strip         = true
opt-level     = "z"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all                             = { level = "deny", priority = -1 }
undocumented_unsafe_blocks      = "forbid"
unnecessary_safety_comment      = "deny"
unnecessary_safety_doc          = "deny"
missing_safety_doc              = "deny"
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
too_many_arguments              = "allow"
new_without_default             = "allow"
